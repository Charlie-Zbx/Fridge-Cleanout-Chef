[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fridge-cleanout-agent"
version = "0.2.0"
description = "A locally hosted meal-planning agent with LangChain, MCP and explicit DeepSeek consent"
requires-python = ">=3.12"
dependencies = [
  "langchain[mcp]==1.4.9", "langchain-deepseek==1.1.1",
  "langgraph-checkpoint-sqlite==3.1.3", "fastapi", "uvicorn",
  "pydantic>=2", "python-multipart", "pillow", "httpx", "python-dotenv"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
include = ["kitchen*"]

[tool.setuptools.package-data]
kitchen = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
